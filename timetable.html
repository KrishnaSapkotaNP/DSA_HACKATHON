
<!DOCTYPE html>
<html>
<head>
    <title>Exam Timetable</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f6f9;
        }

        .course {
            display: inline-block;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            width: 50px;
            font-weight: bold;
        }

        .slot1 { background: lightgreen; }
        .slot2 { background: lightblue; }
        .slot3 { background: lightcoral; }

        .box {
            background: white;
            padding: 15px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>Exam Timetable Visualization</h1>
<p>5 Courses | Maximum 2 Exams Per Slot</p>

<div class="box">
    <h2>Conflict Graph</h2>

    <svg width="300" height="200">
        <!-- Conflict lines -->
        <g stroke="black" stroke-width="2">
            <line x1="50" y1="40" x2="150" y2="40"/>
            <line x1="50" y1="40" x2="100" y2="140"/>
            <line x1="150" y1="40" x2="100" y2="140"/>
            <line x1="150" y1="40" x2="250" y2="90"/>
            <line x1="100" y1="140" x2="250" y2="90"/>
        </g>

        <!-- Courses -->
        <g font-size="16" text-anchor="middle">
            <circle cx="50" cy="40" r="20" fill="lightgreen"/>
            <text x="50" y="46">1</text>

            <circle cx="150" cy="40" r="20" fill="lightblue"/>
            <text x="150" y="46">2</text>

            <circle cx="100" cy="140" r="20" fill="lightcoral"/>
            <text x="100" y="146">3</text>

            <circle cx="250" cy="90" r="20" fill="lightgreen"/>
            <text x="250" y="96">4</text>

            <circle cx="250" cy="160" r="20" fill="lightblue"/>
            <text x="250" y="166">5</text>
        </g>
    </svg>

    <p>Lines represent conflicting courses.</p>
</div>

<div class="box">
    <h2>Final Timetable</h2>

    <h3>Slot 1</h3>
    <div class="course slot1">1</div>
    <div class="course slot1">4</div>

    <h3>Slot 2</h3>
    <div class="course slot2">2</div>
    <div class="course slot2">5</div>

    <h3>Slot 3</h3>
    <div class="course slot3">3</div>

    <hr>
    <h2>Minimum Slots: 3</h2>
    <p>Maximum exams per slot: 2</p>
</div>

</body>
</html>
